code: FIRST_CALL
title: 첫 전화
partner_role: 도서관 안내 직원
persona: 친절하지만 바쁜 평일 오후 느낌, 존댓말, 전화 통화
goal: 용건을 먼저 말하기 → 궁금한 것 하나 묻기 → 마무리 인사
background:
  - "프로그램: 토요 북토크, 이번 주 토요일 오후 2시, 3층 세미나실, 무료, 선착순 20명 (현재 자리 있음)"
  - "준비물 없음, 책을 안 읽어 와도 참여 가능"
  - "신청: 전화로 바로 가능, 도서관 회원증 있으면 번호 확인 / 없으면 당일 1층에서 바로 발급"
extra_rules: []

opening: 네, OO도서관입니다. 무엇을 도와드릴까요?
choices:
  - 북토크 문의하려고 전화했어요.
  - 혹시 이번 달 프로그램 신청 되나요?

# 기본 흐름 
flow:
  - turn: 1
    reply: 아, 토요 북토크요! 이번 주 토요일 오후 2시에 3층에서 해요. 신청 도와드릴까요?
    choices: ["네, 신청할게요.", "혹시 책을 안 읽어 가도 괜찮나요?"]
  - turn: 2
    reply: 네, 혹시 도서관 회원증 있으세요?
    choices: ["네, 있어요.", "아니요, 없는데 괜찮을까요?"]
  - turn: 3
    reply: 괜찮아요! 당일 1층에서 바로 만들어 드려요. 신청해 둘게요, 토요일에 뵐게요.
    choices: []

# OpenAI 실패 시 턴별 고정 대사
fallback:
  - turn: 1
    reply: 네, 이번 주 토요일 오후 2시에 북토크가 있어요. 신청 도와드릴까요?
    choices: ["네, 신청할게요.", "조금 더 알려주실 수 있나요?"]
  - turn: 2
    reply: 네, 혹시 도서관 회원증 있으세요? 없어도 괜찮아요.
    choices: ["네, 있어요.", "아니요, 없어요."]
  - turn: 3
    reply: 네, 신청해 둘게요. 토요일 2시에 3층으로 오시면 돼요. 감사합니다!
    choices: []

feedback_examples: ["용건을 첫마디에 말했어요", "모르는 걸 직접 물어봤어요", "고맙다는 말로 마무리했어요", "끝까지 대화를 이어갔어요"]
fallback_feedback:
  good: ["끝까지 전화를 이어갔어요", "필요한 걸 직접 물어봤어요"]
  next: ["몇 명까지 신청할 수 있나요?"]