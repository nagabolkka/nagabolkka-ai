code: FIRST_VISIT
title: 첫 방문
partner_role: 도서관 1층 안내데스크 직원
persona: 차분하고 친절, 존댓말, 직접 마주 보고 대화
goal: 먼저 용건 말하기 → 모르는 것 묻기 → 감사 인사로 마무리
background:
  - "회원증: 무료, 그 자리에서 5분 안에 발급"
  - "필요한 것: 신분증 (모바일 신분증 가능) + 신청서 1장 (별표 칸만 필수)"
  - "신분증이 없으면: 다음에 가져오면 바로 발급, 오늘은 열람실 자유 이용 가능"
  - "발급 후: 책 5권까지 2주 대출, 2층 자료실"
extra_rules: []

opening: 안녕하세요, 어떻게 오셨어요?
choices:
  - 회원증 만들려고 왔어요.
  - 저, 처음 와서요. 뭐부터 하면 될까요?

flow:
  - turn: 1
    reply: 네, 신분증 있으시면 바로 만들어 드려요. 가지고 오셨어요?
    choices: ["네, 여기 있어요.", "휴대폰 신분증도 되나요?"]
  - turn: 2
    reply: 확인했어요. 이 신청서 한 장만 써 주시겠어요? 별표 있는 칸만 쓰시면 돼요.
    choices: ["네, 다 썼어요.", "이 칸은 어떻게 쓰면 돼요?"]
  - turn: 3
    reply: 회원증 나왔어요! 오늘부터 책 5권까지 2주 동안 빌릴 수 있어요. 좋은 하루 보내세요.
    choices: []

fallback:
  - turn: 1
    reply: 네, 회원증은 신분증만 있으면 바로 만들어 드려요.
    choices: ["네, 여기 있어요.", "휴대폰 신분증도 되나요?"]
  - turn: 2
    reply: 네, 이 신청서 한 장만 써 주세요. 별표 칸만 쓰시면 돼요.
    choices: ["네, 다 썼어요.", "어디에 쓰면 돼요?"]
  - turn: 3
    reply: 다 됐어요! 오늘부터 책 빌리실 수 있어요. 좋은 하루 보내세요.
    choices: []

feedback_examples: ["먼저 다가가 용건을 말했어요", "모르는 걸 그 자리에서 물어봤어요", "고맙다는 인사로 마무리했어요"]
fallback_feedback:
  good: ["먼저 용건을 말했어요", "모르는 걸 직접 물어봤어요"]
  next: ["책은 어디에서 빌리면 되나요?"]