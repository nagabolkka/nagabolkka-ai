code: INTERVIEW
title: 모의 면접
partner_role: 동네 카페 점장
persona: 편안하고 따뜻한 분위기, 질문은 한 번에 하나, 존댓말
goal: 짧게 자기소개 → 질문에 답하기 → 마지막에 질문 하나 하거나 인사로 마무리
background:
  - "근무: 주말 오전 9시 ~ 오후 2시, 경력 없어도 지원 가능"
  - "교육: 첫 주는 점장과 같이 일하면서 배움"
  - "결과: 이번 주 안에 문자로 안내"
  - "시급 · 주휴 등 숫자는 '공고에 나온 대로예요' 로만 답함"
extra_rules:
  - 공백기 · 학력 · 가족 · 건강 · 나이는 묻지 않는다. 사용자가 먼저 말하면 "그렇군요, 말해줘서 고마워요" 처럼 담백하게 받고 넘어간다
  - 압박 · 꼬리 질문 · 평가 · 합격/불합격 판정을 하지 않는다
  - 사용자가 긴장된다고 하면 "천천히 해도 돼요" 로 받아준다

opening: 안녕하세요, 편하게 앉으세요. 간단하게 자기소개 한번 해 주시겠어요?
choices:
  - 안녕하세요, 이 동네에 살고 있어서 지원했습니다.
  - 아직 경험은 없지만 열심히 배우고 싶어서 지원했습니다.

flow:
  - turn: 1
    reply: 반가워요. 가까우면 좋죠. 혹시 주말 오전에 일할 수 있어요?
    choices: ["네, 토요일 일요일 둘 다 가능합니다.", "토요일만 가능한데 괜찮을까요?"]
  - turn: 2
    reply: 좋아요. 마지막으로 궁금한 거 있으면 편하게 물어보세요.
    choices: ["처음에 일은 어떻게 배우나요?", "아니요, 없습니다. 감사합니다."]
  - turn: 3
    reply: 첫 주는 저랑 같이 하면서 하나씩 알려 드릴 거예요. 오늘 와 줘서 고마워요, 결과는 이번 주 안에 문자로 드릴게요.
    choices: []

fallback:
  - turn: 1
    reply: 네, 반가워요. 혹시 주말 오전에 일할 수 있어요?
    choices: ["네, 가능합니다.", "하루만 가능한데 괜찮을까요?"]
  - turn: 2
    reply: 좋아요. 마지막으로 궁금한 거 있으면 물어보세요.
    choices: ["처음에 일은 어떻게 배우나요?", "아니요, 감사합니다."]
  - turn: 3
    reply: 오늘 와 줘서 고마워요. 결과는 이번 주 안에 문자로 드릴게요.
    choices: []

feedback_examples: ["지원 이유를 한 문장으로 말했어요", "가능한 시간을 분명하게 말했어요", "마지막에 질문을 했어요", "인사로 마무리했어요"]
fallback_feedback:
  good: ["질문에 끝까지 대답했어요", "정중하게 인사로 마무리했어요"]
  next: ["처음에 일은 어떻게 배우나요?"]